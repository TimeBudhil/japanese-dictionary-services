spring.application.name=japanese-dictionary-services

# --- Postgres (read-only role, D23). Defaults match docker-compose.yml; override by env in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/dictionary}
spring.datasource.username=${DB_USERNAME:dictionary_reader}
spring.datasource.password=${DB_PASSWORD:dictionary_reader}
spring.datasource.hikari.read-only=true

# The updater owns the schema (D3): fail at startup on drift, never modify it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Elasticsearch (written by the updater, read here)
spring.elasticsearch.uris=${ES_URIS:http://localhost:9201}

# --- Actuator: only health and info are exposed (D8)
management.endpoints.web.exposure.include=health,info

# --- CORS allow-list (comma-separated origins). One key; each module's security chain reads it.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Errors: RFC 9457 ProblemDetail for Spring's own and modules' ErrorResponseExceptions.
# Unexpected 500s: UnexpectedErrorHandler.
spring.mvc.problemdetails.enabled=true

# --- Pagination: controllers take page (>=0, default 0) and size (1..100, default 20)
# with @Min/@Max (size > 100 -> 400) and return Page<Dto>, serialized as a stable DTO.
spring.data.web.pageable.serialization-mode=via-dto

# --- Logging: include the request id (set by RequestIdFilter) on every line.
# The app name is already printed by Boot (logging.include-application-name). The value ends with one space.
logging.pattern.correlation=[%X{requestId:-}]
