# Production profile (--spring.profiles.active=prod): no local defaults, so a missing
# env var fails startup with "Could not resolve placeholder" instead of silently using dev values.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.elasticsearch.uris=${ES_URIS}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
